name: Docker Build and Push

on:
  push:
    branches: [ "master", "main", "feature/*" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files for debug
        run: ls -la

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and test app image
        run: |
          docker build -f Dockerfile.app -t test-repo-app .
          docker run --rm test-repo-app

      - name: Build web image
        run: docker build -f Dockerfile.web -t test-repo-web .

      - name: Tag and push to Docker Hub
        run: |
          docker tag test-repo-app ${{ secrets.DOCKER_USERNAME }}/test-repo-app:latest
          docker tag test-repo-web ${{ secrets.DOCKER_USERNAME }}/test-repo-web:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/test-repo-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/test-repo-web:latest