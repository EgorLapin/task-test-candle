name: Docker Build, Test and Push

on:
  push:
    branches: [ "master", "main", "feature/*" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  APP_IMAGE: ${{ secrets.DOCKER_USERNAME }}/test-repo-app
  WEB_IMAGE: ${{ secrets.DOCKER_USERNAME }}/test-repo-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and test app image locally
        run: |
          docker build -f Dockerfile.app -t test-repo-app .
          # Запускаем контейнер, чтобы проверить, что тесты проходят
          docker run --rm test-repo-app

      - name: Build web image
        run: docker build -f Dockerfile.web -t test-repo-web .

      - name: Run docker-compose integration test
        run: |
          docker-compose up -d
          sleep 5
          curl --fail http://localhost || (docker-compose logs && exit 1)
          docker-compose down

      - name: Tag images for Docker Hub
        run: |
          docker tag test-repo-app ${{ env.APP_IMAGE }}:latest
          docker tag test-repo-web ${{ env.WEB_IMAGE }}:latest

      - name: Push images to Docker Hub
        run: |
          docker push ${{ env.APP_IMAGE }}:latest
          docker push ${{ env.WEB_IMAGE }}:latest