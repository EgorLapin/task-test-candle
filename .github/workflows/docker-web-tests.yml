name: Docker Build, Test and Push + Helm Chart Release

on:
  push:
    branches: [ "master", "main", "feature/*" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  APP_IMAGE: ${{ secrets.DOCKER_USERNAME }}/test-repo-app
  WEB_IMAGE: ${{ secrets.DOCKER_USERNAME }}/test-repo-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # важно для получения тегов, если нужно

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and test app image
        run: |
          docker build -f Dockerfile.app -t ${{ env.APP_IMAGE }}:latest .
          docker run --rm ${{ env.APP_IMAGE }}:latest

      - name: Build web image
        run: docker build -f Dockerfile.web -t ${{ env.WEB_IMAGE }}:latest .

      - name: Push images to Docker Hub
        run: |
          docker push ${{ env.APP_IMAGE }}:latest
          docker push ${{ env.WEB_IMAGE }}:latest

      # --- Helm steps ---
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.17.0'

      - name: Package Helm chart
        run: |
          cd helm
          helm package ./test-repo-chart
          echo "CHART_ARCHIVE=$(ls test-repo-chart-*.tgz | head -1)" >> $GITHUB_ENV

      - name: Create GitHub Release and upload chart
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_number }}
          files: helm/${{ env.CHART_ARCHIVE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}