services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: app

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: web
    ports:
      - "80:80"
    depends_on:
      - app
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro